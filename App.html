<script>
const $=id=>document.getElementById(id);let TOKEN=sessionStorage.getItem('es_token')||'',USER=null,DATA=null,LANG='hi';
function call(action,payload={}){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>{if(r&&r.ok===false)reject(new Error(r.message));else resolve(r)}).withFailureHandler(e=>reject(new Error(e.message||'Server error'))).api(action,{...payload,token:TOKEN}));}
function toast(m,bad=false){let t=document.createElement('div');t.className='toast';t.textContent=m;if(bad)t.style.background='#a52c3b';document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function header(){return '<header class="topbar"><div class="brand"><div class="brand-mark">ES</div><div>Exam Saathi<small>TRAVEL WITH CONFIDENCE</small></div></div><nav class="nav"><a href="#" onclick="home();return false">Home</a><a href="#how">How it works</a><a href="#safety">Safety</a><button class="btn light sm" onclick="authView(\'login\')">Login</button><button class="btn orange sm" onclick="authView(\'register\')">Get started</button></nav></header>';}
function home(){TOKEN='';USER=null;document.body.innerHTML='<div id="app">'+header()+`<section class="hero"><div class="hero-inner"><div><div class="eyebrow">EXAM DAY MOBILITY • BIHAR</div><h1>परीक्षा के दिन<br><span>सफर आसान।</span></h1><p>अपने गाँव से परीक्षा केंद्र तक भरोसेमंद यात्रा समन्वय। एक ही route पर जाने वाले विद्यार्थियों के लिए व्यवस्थित booking, verified driver और स्पष्ट किराया।</p><button class="btn orange" onclick="authView('register')">अपनी ride बुक करें →</button> <button class="btn light" onclick="authView('login')">Student login</button><p style="font-size:11px">Parent consent required • Transparent pricing • Local coordination</p></div><div class="hero-card"><h3>यात्रा कैसे शुरू करें?</h3><div class="field"><label>गाँव / शहर</label><input id="quickVillage" placeholder="जैसे: Goraul"></div><div class="field"><label>परीक्षा केंद्र</label><select id="quickCentre"><option value="">केंद्र चुनें</option></select></div><button class="btn" style="width:100%" onclick="authView('register')">Check available rides</button><p class="muted">Booking से पहले account बनाना जरूरी है।</p></div></div></section><section class="section" id="how"><div class="section-head"><div class="eyebrow" style="color:#2674d9">SIMPLE & TRANSPARENT</div><h2>यात्रा के 3 आसान कदम</h2><p>आपकी परीक्षा, आपका route और आपकी सुविधा — coordination एक जगह।</p></div><div class="steps"><div class="step"><b>01</b><h3>अपनी जानकारी दें</h3><p>Exam date, centre, गाँव और pickup point चुनें।</p></div><div class="step"><b>02</b><h3>Booking review</h3><p>Coordinator route, consent और vehicle availability जाँचेगा।</p></div><div class="step"><b>03</b><h3>यात्रा की पुष्टि</h3><p>Driver और pickup details मिलने पर समय से तैयार रहें।</p></div></div></section><section class="section" id="safety"><div class="section-head"><h2>सुरक्षा और पारदर्शिता पहले</h2><p>Verified driver/vehicle approval, parent consent, सीमित data access और साफ fare breakdown। यह platform live GPS tracking या emergency response service का दावा नहीं करता।</p></div></section><footer class="footer"><strong>Exam Saathi</strong><p>परीक्षा के दिन सफर आसान, सुरक्षित और समय पर।</p><p>यह एक travel coordination service है, transport operator नहीं। यात्रा की पुष्टि केवल coordinator द्वारा booking approve और driver assign करने के बाद होगी।</p><p>© 2026 Exam Saathi · <a style="color:#b8d5ff" href="#" onclick="privacy();return false">Privacy & safety</a></p></footer></div>`;loadPublic();}
async function loadPublic(){try{let d=await call('publicData');let s=$('quickCentre');if(s)s.innerHTML+=(d.centres||[]).map(x=>'<option>'+esc(x.Name)+'</option>').join('');}catch(e){}}
function authView(mode){
  const isReg=mode==='register';
  const app=$('app');
  if(!app) return;
  app.innerHTML=header()+`<div class="auth-wrap"><div class="auth-card"><div class="brand-mark">ES</div><h2>${isReg?'Create your student account':'Welcome back'}</h2><p class="muted">${isReg?'Parent/guardian details are required for student travel.':'Login to manage your exam day journey.'}</p><div id="authMsg" role="status" aria-live="polite"></div><form id="authForm" novalidate>
  ${isReg?`<div class="field"><label for="aName">Student full name</label><input id="aName" name="name" autocomplete="name" maxlength="100" required></div><div class="grid2"><div class="field"><label for="aEmail">Email</label><input id="aEmail" name="email" type="email" autocomplete="email" maxlength="160" required></div><div class="field"><label for="aMobile">Mobile</label><input id="aMobile" name="mobile" inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" required></div></div><div class="field"><label for="aVillage">Village</label><input id="aVillage" name="village" maxlength="100" required></div><div class="field"><label for="aGuardian">Parent / Guardian name</label><input id="aGuardian" name="guardianName" maxlength="100" required></div><div class="field"><label for="aGuardianMobile">Guardian mobile</label><input id="aGuardianMobile" name="guardianMobile" inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" required></div><div class="field"><label for="aPassword">Password (minimum 10 characters)</label><input id="aPassword" name="password" type="password" minlength="10" autocomplete="new-password" required></div><label class="muted"><input id="aConsent" name="consent" type="checkbox" required> I confirm parent/guardian consent for travel coordination and agree to the privacy policy.</label>`: `<div class="field"><label for="aEmail">Email</label><input id="aEmail" name="email" type="email" autocomplete="username" required></div><div class="field"><label for="aPassword">Password</label><input id="aPassword" name="password" type="password" autocomplete="current-password" required></div>`}
  <button id="authSubmit" class="btn" type="submit" style="width:100%;margin-top:18px">${isReg?'Create account':'Secure login'}</button></form><p class="muted" style="margin-top:20px">${isReg?'Already registered?':'New student?'} <a href="#" id="authSwitch">${isReg?'Login':'Create account'}</a></p><a href="#" class="muted" id="authHome">← Back to home</a></div></div>`;
  const form=$('authForm');
  if(form) form.addEventListener('submit',function(ev){ev.preventDefault();if(!form.reportValidity())return;if(isReg)register();else login();});
  const sw=$('authSwitch');if(sw)sw.addEventListener('click',function(ev){ev.preventDefault();authView(isReg?'login':'register');});
  const back=$('authHome');if(back)back.addEventListener('click',function(ev){ev.preventDefault();home();});
}
async function register(){let p={name:$('aName').value,email:$('aEmail').value,mobile:$('aMobile').value,village:$('aVillage').value,guardianName:$('aGuardian').value,guardianMobile:$('aGuardianMobile').value,password:$('aPassword').value,consent:$('aConsent').checked};try{let r=await call('register',p);toast(r.message);authView('login')}catch(e){toast(e.message,true)}}
async function login(){try{let r=await call('login',{email:$('aEmail').value,password:$('aPassword').value});TOKEN=r.token;sessionStorage.setItem('es_token',TOKEN);USER=r.user;routeRole();}catch(e){toast(e.message,true)}}
async function routeRole(){try{let r=await call('me');USER=r.user;if(USER.role==='ADMIN')adminView();else if(USER.role==='DRIVER')driverView();else studentView();}catch(e){TOKEN='';sessionStorage.removeItem('es_token');authView('login')}}
function logout(){call('logout').catch(()=>{});TOKEN='';sessionStorage.removeItem('es_token');home();}
function shell(title,role,body,nav){$('app').innerHTML=header()+`<div class="shell"><aside class="sidebar"><div class="side-label">${role} WORKSPACE</div>${nav}</aside><main class="main"><div class="page-title"><div><h1>${title}</h1><div class="muted">Welcome, ${esc(USER.name)}</div></div><button class="btn ghost sm" onclick="logout()">Logout</button></div>${body}</main></div><div class="mobile-nav"><button onclick="location.reload()">Home</button><button onclick="logout()">Logout</button></div>`;}
async function studentView(){try{DATA=await call('studentData');let s=DATA.student,b=DATA.bookings;let nav='<div class="side-link active">Overview</div><div class="side-link" onclick="bookingForm()">Book a ride</div><div class="side-link" onclick="studentView()">My bookings</div>';let notes=DATA.notifications||[];let unread=notes.filter(n=>n.Read!=='YES').length;let body=`<div class="card" style="margin-bottom:18px"><div class="page-title"><h3>Notifications</h3><button class="btn ghost sm" onclick="markAllNotificationsRead()">Mark all read (${unread})</button></div>${notes.length?notes.map(n=>'<div class="notice '+(n.Read==='YES'?'':'success')+'"><strong>'+esc(n.Title)+'</strong><p>'+esc(n.Message)+'</p><small>'+esc(n.CreatedAt)+'</small></div>').join(''):'<p class="muted">No notifications yet.</p>'}</div><div class="stats"><div class="stat"><small>My bookings</small><strong>${b.length}</strong></div><div class="stat"><small>Pending</small><strong>${b.filter(x=>x.Status==='Pending').length}</strong></div><div class="stat"><small>Confirmed</small><strong>${b.filter(x=>x.Status==='Confirmed'||x.Status==='Driver Assigned').length}</strong></div><div class="stat"><small>Parent consent</small><strong style="font-size:18px">Recorded</strong></div></div><div class="card"><h3>Student profile</h3><p>${esc(s.Name)} · ${esc(s.Village||'Village not set')}</p><p class="muted">Guardian: ${esc(s.GuardianName)} · ${esc(s.GuardianMobile)}</p><button class="btn" onclick="bookingForm()">+ Request a ride</button> <button class="btn ghost" onclick="studentProfileModal()">Edit profile</button></div><h3 style="margin-top:26px">Booking history</h3>${bookingTable(b,true)}`;shell('Student dashboard','STUDENT',body,nav);}catch(e){toast(e.message,true)}}
function bookingTable(bs,own){if(!bs.length)return'<div class="card empty">अभी कोई booking नहीं है।</div>';return'<div class="table-wrap"><table><thead><tr><th>'+(own?'Booking ID':'Select / ID')+'</th><th>Exam</th><th>Route</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody>'+bs.map(b=>'<tr><td>'+(own?esc(b.ID):'<input type="checkbox" class="booking-pick" value="'+esc(b.ID)+'"> '+esc(b.ID))+'</td><td>'+esc(b.Exam.Name||b.ExamID)+'</td><td>'+esc(b.Route.Village||'—')+'</td><td>₹'+esc(b.TotalAmount)+'</td><td>'+pill(b.Status)+'</td><td>'+(own?((['Pending','Under Review'].includes(b.Status)?'<button class="btn ghost sm" onclick="cancelBooking(\''+b.ID+'\')">Cancel</button> ':'')+'<button class="btn ghost sm" onclick="downloadReceipt(\''+b.ID+'\')">Receipt</button>'):('<button class="btn ghost sm" onclick="setBookingPrompt(\''+b.ID+'\')">Status</button> <button class="btn ghost sm" onclick="paymentModal(\''+b.ID+'\')">Payment</button>'))+'</td></tr>').join('')+'</tbody></table></div>';}
function pill(s){let c=['Confirmed','Completed','Driver Assigned','Verified'].includes(s)?'green':['Pending','Under Review','Ready'].includes(s)?'orange':['Rejected','Cancelled'].includes(s)?'red':'';return'<span class="pill '+c+'">'+esc(s)+'</span>';}
async function downloadReceipt(id){try{let r=await call('receipt',{bookingId:id}),a=document.createElement('a');a.href='data:application/pdf;base64,'+r.base64;a.download=r.name;a.click();toast('Receipt generated')}catch(e){toast(e.message,true)}}
async function setBookingPrompt(id){let status=prompt('Status: Under Review, Confirmed, Rejected or Cancelled','Under Review');if(!status)return;try{await call('adminStatus',{bookingId:id,status});toast('Booking status updated');adminView()}catch(e){toast(e.message,true)}}
function bookingForm(){let d=DATA.public;let html='<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h3>Book your exam ride</h3><button class="btn ghost sm" onclick="closeModal()">✕</button></div><div class="field"><label>Examination</label><select id="bExam">'+d.exams.map(x=>'<option value="'+x.ID+'">'+esc(x.Name)+' · '+esc(x.ExamDate)+'</option>').join('')+'</select></div><div class="field"><label>Village to pickup route</label><select id="bRoute">'+d.routes.map(x=>'<option value="'+x.ID+'">'+esc(x.Village)+' → '+esc((d.centres.find(c=>c.ID===x.CentreID)||{}).Name||'Centre')+' · ₹'+esc(x.Fare)+'</option>').join('')+'</select></div><div class="notice">Coordination fee: ₹'+d.fee+' · Final vehicle/driver assignment is subject to review and seat availability.</div><button class="btn" onclick="submitBooking()">Submit booking request</button></div></div>';$('app').insertAdjacentHTML('beforeend',html);}
function closeModal(){$('modal')?.remove()}
async function submitBooking(){try{let r=await call('createBooking',{examId:$('bExam').value,routeId:$('bRoute').value});closeModal();toast(r.message);studentView()}catch(e){toast(e.message,true)}}
async function cancelBooking(id){if(!confirm('Cancel this booking request?'))return;try{await call('cancelBooking',{bookingId:id});toast('Booking cancelled');studentView()}catch(e){toast(e.message,true)}}
async function adminView(){try{DATA=await call('adminData');let n=['Overview','Bookings','Students','Drivers','Vehicles','Exams','Centres','Routes','Trips','Audit Log','Reports','Settings'];let nav=n.map(x=>'<div class="side-link" onclick="adminSection(\''+x+'\')">'+x+'</div>').join('');let st=DATA.stats;let body='<div class="stats">'+[['Total students',st.students],['Total bookings',st.bookings],['Pending review',st.pending],['Confirmed',st.confirmed],['Verified drivers',st.drivers],['Approved vehicles',st.vehicles],['Upcoming trips',st.upcomingTrips],['Completed trips',st.completedTrips],['Vehicle fare total','₹'+st.vehicleFare],['Coordination fees accrued','₹'+st.coordinationRevenue],['Payments received','₹'+st.revenue]].map(x=>'<div class="stat"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')+'</div><div class="feature-grid"><div class="feature"><h3>Booking operations</h3><p>Review booking requests and update their status.</p><button class="btn sm" onclick="adminSection(\'Bookings\')">Manage bookings</button></div><div class="feature"><h3>Network setup</h3><p>Add exam centres, routes and approved vehicles.</p><button class="btn sm" onclick="adminSection(\'Routes\')">Manage routes</button></div><div class="feature"><h3>Driver onboarding</h3><p>Create driver logins; verification remains pending until reviewed.</p><button class="btn sm" onclick="adminSection(\'Drivers\')">Manage drivers</button></div></div>';shell('Operations overview','ADMIN',body,nav);}catch(e){toast(e.message,true)}}
function adminSection(which){let d=DATA,body='';if(which==='Overview'){adminView();return;}if(which==='Bookings'){body='<div class="toolbar"><input id="filter" placeholder="Search booking ID / student" oninput="filterTable()"><button class="btn sm" onclick="assignTripModal()">Assign selected group</button></div>'+bookingTable(d.bookings,false).replace('<table>','<table id="dataTable">');}else if(which==='Students'){body=basicTable(d.students,['Name','Mobile','GuardianName','Village','Status']);}else if(which==='Drivers'){body='<button class="btn sm" onclick="driverModal()">+ Add driver login</button><br><br>'+verificationTable(d.drivers,'Drivers',['ID','Name','Mobile','LicenseNumber','VerificationStatus','Status']);}else if(which==='Vehicles'){body='<button class="btn sm" onclick="recordModal(\'Vehicles\')">+ Add vehicle</button><br><br>'+verificationTable(d.vehicles,'Vehicles',['ID','DriverID','RegistrationNo','Type','Capacity','VerificationStatus','Status']);}else if(which==='Exams'){body='<button class="btn sm" onclick="recordModal(\'Exams\')">+ Add exam</button><br><br>'+basicTable(d.exams,['Name','ExamDate','ReportingTime','Deadline','Status'],'Exams');}else if(which==='Centres'){body='<button class="btn sm" onclick="recordModal(\'ExamCenters\')">+ Add centre</button><br><br>'+basicTable(d.centres,['ID','Name','District','Address','Status'],'ExamCenters');}else if(which==='Routes'){body='<button class="btn sm" onclick="recordModal(\'Routes\')">+ Add route</button><br><br>'+basicTable(d.routes,['ID','Village','PickupPoint','CentreID','DistanceKm','Fare','Status'],'Routes');}else if(which==='Trips'){body=tripAdminTable(d.trips,d.drivers,d.vehicles); }else if(which==='Audit Log'){body=auditTable(d.auditLogs||[]);}else if(which==='Reports'){body='<div class="card"><h3>Operations report</h3><p>Total bookings: '+d.stats.bookings+'</p><p>Payment received: ₹'+d.stats.revenue+'</p><div class="grid2"><div class="field"><label>From date (optional)</label><input id="reportFrom" type="date"></div><div class="field"><label>To date (optional)</label><input id="reportTo" type="date"></div></div><button class="btn" onclick="exportCSV()">Export bookings CSV</button> <button class="btn orange" onclick="downloadAdminReport()">Generate filtered PDF</button></div>'; }else if(which==='Settings'){body=settingsForm(d.settings);}shell(which,'ADMIN',body,['Overview','Bookings','Students','Drivers','Vehicles','Exams','Centres','Routes','Trips','Audit Log','Reports','Settings'].map(x=>'<div class="side-link" onclick="adminSection(\''+x+'\')">'+x+'</div>').join(''));}
function verificationTable(arr,table,cols){
 if(!arr.length)return'<div class="card empty">No records yet.</div>';
 return'<div class="table-wrap"><table><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'<th>Actions</th></tr></thead><tbody>'+arr.map(r=>{
  let edit=table==='Drivers'?'<button class="btn ghost sm" onclick="editDriver(\''+r.ID+'\')">Edit</button> ':table==='Vehicles'?'<button class="btn ghost sm" onclick="editRecord(\'Vehicles\',\''+r.ID+'\')">Edit</button> ':'';
  let review=r.VerificationStatus==='Pending'?'<button class="btn sm" onclick="verifyRecord(\''+table+'\',\''+r.ID+'\',\'Verified\')">Approve</button> <button class="btn ghost sm" onclick="verifyRecord(\''+table+'\',\''+r.ID+'\',\'Rejected\')">Reject</button>':pill(r.VerificationStatus);
  return'<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+'<td>'+edit+review+'</td></tr>';
 }).join('')+'</tbody></table></div>';
}
async function verifyRecord(table,id,status){try{await call('adminVerify',{table,id,status});toast('Verification updated');adminView()}catch(e){toast(e.message,true)}}
function basicTable(arr,cols,table){if(!arr.length)return'<div class="card empty">No records yet.</div>';return'<div class="table-wrap"><table><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+(table?'<th>Action</th>':'')+'</tr></thead><tbody>'+arr.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+(table?'<td><button class="btn ghost sm" onclick="editRecord(\''+table+'\',\''+r.ID+'\')">Edit</button></td>':'')+'</tr>').join('')+'</tbody></table></div>';}
async function setBooking(id,status){if(!id){toast('Reload and choose a booking row.',true);return}try{await call('adminStatus',{bookingId:id,status});toast('Status updated');adminView()}catch(e){toast(e.message,true)}}
function filterTable(){let q=$('filter').value.toLowerCase();document.querySelectorAll('#dataTable tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none');}
function recordModal(table,record){record=record||{};let fields={Exams:['Name','ExamDate','ReportingTime','StartTime','EndTime','Deadline','Status'],ExamCenters:['Name','Address','District','MapsUrl','Contact','Status'],Routes:['Village','PickupPoint','CentreID','DistanceKm','DurationMin','Fare','Status'],Vehicles:['DriverID','RegistrationNo','Type','Capacity','InsuranceExpiry','PermitExpiry','FitnessExpiry']}[table];let html='<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h3>'+(record.ID?'Edit ':'Add ')+table+'</h3><button class="btn ghost sm" onclick="closeModal()">✕</button></div>'+fields.map(f=>'<div class="field"><label>'+f+'</label><input id="f_'+f+'" value="'+esc(record[f]||'')+'" '+(['ExamDate','StartTime','EndTime','Deadline','InsuranceExpiry','PermitExpiry','FitnessExpiry'].includes(f)?'type="datetime-local"':'')+'></div>').join('')+'<button class="btn" onclick="saveRecord(\''+table+'\',\''+(record.ID||'')+'\')">Save record</button></div></div>';$('app').insertAdjacentHTML('beforeend',html);}
function editRecord(table,id){let key={Exams:'exams',ExamCenters:'centres',Routes:'routes',Vehicles:'vehicles'}[table],row=(DATA[key]||[]).find(x=>x.ID===id);if(!row){toast('Record not found',true);return;}recordModal(table,row);}async function saveRecord(table,id){let fields={Exams:['Name','ExamDate','ReportingTime','StartTime','EndTime','Deadline'],ExamCenters:['Name','Address','District','MapsUrl','Contact'],Routes:['Village','PickupPoint','CentreID','DistanceKm','DurationMin','Fare'],Vehicles:['DriverID','RegistrationNo','Type','Capacity','InsuranceExpiry','PermitExpiry','FitnessExpiry']}[table],record={};fields.forEach(f=>record[f]=$('f_'+f).value);if(id)record.ID=id;try{await call('adminSave',{table,record});toast('Saved');closeModal();adminView()}catch(e){toast(e.message,true)}}
function driverModal(){$('app').insertAdjacentHTML('beforeend','<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h3>Create driver account</h3><button class="btn ghost sm" onclick="closeModal()">✕</button></div>'+[['name','Full name'],['email','Email'],['mobile','Mobile'],['license','Driving licence no.'],['password','Temporary password (12+ chars)']].map(x=>'<div class="field"><label>'+x[1]+'</label><input id="d_'+x[0]+'" '+(x[0]==='password'?'type="password"':'')+'></div>').join('')+'<button class="btn" onclick="createDriver()">Create driver</button></div></div>');}
async function createDriver(){let driver={};['name','email','mobile','license','password'].forEach(k=>driver[k]=$('d_'+k).value);try{let r=await call('adminCreateDriver',{driver});toast(r.message);closeModal();adminView()}catch(e){toast(e.message,true)}}
async function driverView(){try{DATA=await call('driverData');let trips=DATA.trips,body='<div class="stats"><div class="stat"><small>Assigned trips</small><strong>'+trips.length+'</strong></div><div class="stat"><small>Verification</small><strong style="font-size:16px">'+esc(DATA.driver.VerificationStatus)+'</strong></div></div>'+ (trips.length?trips.map(t=>'<div class="card" style="margin-bottom:14px"><h3>'+esc(t.ID)+' · '+pill(t.Status)+'</h3><p>'+esc(t.Route.Village)+' / '+esc(t.Route.PickupPoint)+' → '+esc(t.Centre.Name)+'</p><p class="muted">Pickup: '+esc(t.PickupTime)+' · Vehicle: '+esc(t.Vehicle.RegistrationNo)+' · Passengers: '+t.Passengers.length+'</p><p>'+t.Passengers.map(p=>esc(p.Name)).join(', ')+'</p><a target="_blank" href="'+esc(t.Centre.MapsUrl||'https://maps.google.com/?q='+encodeURIComponent(t.Centre.Address||''))+'">Open navigation ↗</a><div class="toolbar" style="margin-top:15px"><button class="btn sm" onclick="tripStatus(\''+t.ID+'\',\'Ready\')">Ready</button><button class="btn sm" onclick="tripStatus(\''+t.ID+'\',\'Started\')">Start trip</button><button class="btn sm" onclick="tripStatus(\''+t.ID+'\',\'Completed\')">Complete</button></div></div>').join(''):'<div class="card empty">No trips assigned yet.</div>');shell('Driver workspace','DRIVER',body,'<div class="side-link active">Assigned trips</div>');}catch(e){toast(e.message,true)}}
async function markAllNotificationsRead(){try{await call('markNotificationsRead',{all:true});studentView();}catch(e){toast(e.message,true)}}
async function tripStatus(tripId,status){try{await call('driverTripStatus',{tripId,status});toast('Trip updated');driverView()}catch(e){toast(e.message,true)}}

function assignTripModal(){let ids=Array.from(document.querySelectorAll('.booking-pick:checked')).map(x=>x.value);if(!ids.length){toast('Select bookings first.',true);return;}let eligible=DATA.drivers.filter(x=>x.Status==='Active'&&x.VerificationStatus==='Verified'),vehicles=DATA.vehicles.filter(x=>x.Status==='Active'&&x.VerificationStatus==='Verified');let html='<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h3>Assign group trip</h3><button class="btn ghost sm" onclick="closeModal()">✕</button></div><div class="notice">Selected passengers: '+ids.length+'. Server will enforce same route/exam and vehicle capacity.</div><div class="field"><label>Verified driver</label><select id="tripDriver">'+eligible.map(x=>'<option value="'+x.ID+'">'+esc(x.Name)+' · '+esc(x.Mobile)+'</option>').join('')+'</select></div><div class="field"><label>Verified vehicle</label><select id="tripVehicle">'+vehicles.map(x=>'<option value="'+x.ID+'">'+esc(x.RegistrationNo)+' · capacity '+esc(x.Capacity)+'</option>').join('')+'</select></div><div class="field"><label>Pickup date & time</label><input id="tripPickup" type="datetime-local"></div><button class="btn" onclick="submitTrip()">Confirm assignment</button></div></div>';$('app').insertAdjacentHTML('beforeend',html);}
async function submitTrip(){let bookingIds=Array.from(document.querySelectorAll('.booking-pick:checked')).map(x=>x.value);try{let r=await call('adminAssignTrip',{bookingIds,driverId:$('tripDriver').value,vehicleId:$('tripVehicle').value,pickupTime:$('tripPickup').value});toast(r.message);closeModal();adminView()}catch(e){toast(e.message,true)}}
function paymentModal(id){let amount=prompt('Amount received (₹):');if(amount===null)return;let method=prompt('Method: Cash or UPI','UPI');if(!method)return;let reference=method.toUpperCase()==='UPI'?prompt('UPI reference / UTR:')||'':'';let status=prompt('Status: Received or Pending','Received')||'Pending';call('adminPayment',{bookingId:id,amount,method:method[0].toUpperCase()+method.slice(1).toLowerCase(),reference,status}).then(()=>{toast('Payment recorded');adminView()}).catch(e=>toast(e.message,true));}

function exportCSV(){let a=DATA.bookings,cols=['ID','StudentID','ExamID','RouteID','VehicleFare','CoordinationFee','TotalAmount','Status','CreatedAt'];let csv=[cols.join(','),...a.map(r=>cols.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))].join('\n'),blob=new Blob([csv],{type:'text/csv'}),url=URL.createObjectURL(blob),el=document.createElement('a');el.href=url;el.download='exam-saathi-bookings.csv';el.click();URL.revokeObjectURL(url);}
function privacy(){alert('We collect only the information needed for travel coordination. Student and guardian information is restricted to authorized coordinators and assigned drivers where needed. Do not share OTPs, UPI PINs or banking passwords. Contact the platform coordinator for correction or deletion requests.');}
if(TOKEN)routeRole();else home();


function tripAdminTable(trips,drivers,vehicles){
 if(!trips.length)return'<div class="card empty">No trips scheduled.</div>';
 return'<div class="table-wrap"><table><thead><tr><th>Trip</th><th>Route</th><th>Driver</th><th>Vehicle</th><th>Pickup time</th><th>Status</th><th>Action</th></tr></thead><tbody>'+trips.map(t=>{let d=drivers.find(x=>x.ID===t.DriverID)||{},v=vehicles.find(x=>x.ID===t.VehicleID)||{};return'<tr><td>'+esc(t.ID)+'</td><td>'+esc(t.RouteID)+'</td><td>'+esc(d.Name||t.DriverID)+'</td><td>'+esc(v.RegistrationNo||t.VehicleID)+'</td><td>'+esc(t.PickupTime)+'</td><td>'+pill(t.Status)+'</td><td>'+(['Assigned','Ready'].includes(t.Status)?'<button class="btn ghost sm" onclick="rescheduleTrip(\''+t.ID+'\')">Reschedule</button>':'—')+'</td></tr>';}).join('')+'</tbody></table></div>';
}
function auditTable(logs){
 if(!logs.length)return'<div class="card empty">No audit entries yet.</div>';
 return'<div class="table-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th><th>Detail</th></tr></thead><tbody>'+logs.map(x=>'<tr><td>'+esc(x.CreatedAt)+'</td><td>'+esc(x.ActorID)+'</td><td>'+esc(x.Action)+'</td><td>'+esc(x.Entity)+'</td><td>'+esc(x.Detail)+'</td></tr>').join('')+'</tbody></table></div>';
}
async function rescheduleTrip(id){
 let value=prompt('New pickup date/time (YYYY-MM-DDTHH:mm). Only future time is accepted.');
 if(!value)return;
 try{let r=await call('adminTripReschedule',{tripId:id,pickupTime:value});toast(r.message);adminView();}catch(e){toast(e.message,true);}
}
async function editDriver(id){
 let d=DATA.drivers.find(x=>x.ID===id);if(!d)return;
 let name=prompt('Driver name',d.Name);if(name===null)return;
 let mobile=prompt('10-digit mobile',d.Mobile);if(mobile===null)return;
 let license=prompt('Driving licence number',d.LicenseNumber||'');if(license===null)return;
 let status=prompt('Account status: Active or Inactive',d.Status);if(!status)return;
 try{let r=await call('adminUpdateDriver',{driverId:id,name,mobile,license,status});toast(r.message);adminView();}catch(e){toast(e.message,true);}
}

function studentAdminTable(arr){
 if(!arr.length)return'<div class="card empty">No students registered.</div>';
 return'<div class="table-wrap"><table><thead><tr><th>Name</th><th>Mobile</th><th>Village</th><th>Guardian</th><th>Status</th><th>Action</th></tr></thead><tbody>'+arr.map(x=>'<tr><td>'+esc(x.Name)+'</td><td>'+esc(x.Mobile)+'</td><td>'+esc(x.Village)+'</td><td>'+esc(x.GuardianName)+'</td><td>'+pill(x.Status)+'</td><td>'+(x.Status==='Active'?'<button class="btn ghost sm" onclick="changeStudentStatus(\''+x.ID+'\',\'Inactive\')">Deactivate</button>':'<button class="btn sm" onclick="changeStudentStatus(\''+x.ID+'\',\'Active\')">Activate</button>')+'</td></tr>').join('')+'</tbody></table></div>';
}
async function changeStudentStatus(studentId,status){
 if(!confirm('Are you sure you want to '+status.toLowerCase()+' this student account?'))return;
 try{let r=await call('adminStudentStatus',{studentId,status});toast(r.message);adminView();}catch(e){toast(e.message,true);}
}
function settingsForm(s){
 return'<div class="card"><h3>Website settings</h3><div class="field"><label>Website name</label><input id="setName" value="'+esc(s.name)+'"></div><div class="field"><label>Coordination fee (₹)</label><input id="setFee" type="number" min="0" max="5000" value="'+esc(s.fee)+'"></div><div class="field"><label>Support email (optional)</label><input id="setEmail" type="email" value="'+esc(s.supportEmail||'')+'"></div><div class="field"><label>Support mobile (optional)</label><input id="setPhone" inputmode="numeric" value="'+esc(s.supportPhone||'')+'"></div><button class="btn" onclick="saveSettings()">Save settings</button><p class="muted">Fee changes apply to new bookings only. Existing booking totals are not recalculated.</p></div>';
}
async function saveSettings(){
 try{let r=await call('adminSettingsUpdate',{settings:{siteName:$('setName').value,fee:$('setFee').value,supportEmail:$('setEmail').value,supportPhone:$('setPhone').value}});toast(r.message);adminView();}catch(e){toast(e.message,true);}
}
async function downloadAdminReport(){
 try{let r=await call('adminReportPdf',{from:$('reportFrom')?.value||'',to:$('reportTo')?.value||''}),a=document.createElement('a');a.href='data:application/pdf;base64,'+r.base64;a.download=r.name;a.click();toast('PDF report generated ('+r.count+' bookings)');}catch(e){toast(e.message,true);}
}
function studentProfileModal(){
 let s=DATA.student;
 let html='<div class="modal-bg" id="modal"><div class="modal"><div class="modal-head"><h3>Edit student profile</h3><button class="btn ghost sm" onclick="closeModal()">✕</button></div>'+[['name','Full name',s.Name],['mobile','Mobile',s.Mobile],['village','Village',s.Village],['guardianName','Parent / guardian',s.GuardianName],['guardianMobile','Guardian mobile',s.GuardianMobile]].map(x=>'<div class="field"><label>'+x[1]+'</label><input id="profile_'+x[0]+'" value="'+esc(x[2])+'"></div>').join('')+'<label class="muted"><input id="profile_consent" type="checkbox"> I reconfirm parent/guardian consent if guardian details are changed.</label><button class="btn" onclick="saveStudentProfile()">Save profile</button></div></div>';
 $('app').insertAdjacentHTML('beforeend',html);
}
async function saveStudentProfile(){
 try{let p={};['name','mobile','village','guardianName','guardianMobile'].forEach(k=>p[k]=$('profile_'+k).value);p.consent=$('profile_consent').checked;let r=await call('studentProfileUpdate',p);toast(r.message);closeModal();studentView();}catch(e){toast(e.message,true);}
}

</script>
